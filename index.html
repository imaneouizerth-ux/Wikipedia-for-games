function tr(k){return (T[lang]&&T[lang][k])||T.ar[k]||k}
function card(g){const i=games.indexOf(g);return `<div class="card" data-index="${i}"><h3>${esc(g.name)}</h3><span class="tag">${esc(g.genre)}</span><p>${esc(g.year)} · ${esc(g.developer)}${g.lead?' · '+esc(g.lead):''}</p></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){app.innerHTML=`<section class="hero"><h1>GamePedia</h1><p>${tr('hero')} <b>25,000</b> ${tr('entries')}.</p><div class="stats"><div class="stat"><b>25,000+</b>${tr('entries')}</div><div class="stat"><b>10</b>${tr('cats')}</div><div class="stat"><b>${tr('search')}</b></div><div class="stat"><b>∞</b>${tr('all')}</div></div></section><h2>${tr('famous')}</h2><div class="grid">${realGames.map(card).join('')}</div>`;}
function render(title){const total=current.length,start=(page-1)*30;app.innerHTML=`<section><h1>${esc(title)}</h1><div class="grid">${current.slice(start,start+30).map(card).join('')||'<div class="empty">'+tr('none')+'</div>'}</div><p>${tr('showing')} ${total?start+1:0}-${Math.min(start+30,total)} ${tr('of')} ${total}</p><div class="pager"><button id="prev">${tr('previous')}</button><button id="next">${tr('next')}</button></div></section>`;document.getElementById('prev').disabled=page<=1;document.getElementById('next').disabled=start+30>=total;}
function normalizeText(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\u0600-\u06ff]+/g,'').replace(/[إأآا]/g,'ا').replace(/[ى]/g,'ي').replace(/[ة]/g,'ه');}
function levenshtein(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return prev[n];}
function similarity(a,b){a=normalizeText(a);b=normalizeText(b);if(!a||!b)return 0;if(a===b)return 1;if(a.includes(b)||b.includes(a))return .94;const d=levenshtein(a,b);return 1-d/Math.max(a.length,b.length);}
function tokens(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\u0600-\u06ff]+/g,' ').replace(/[إأآا]/g,'ا').replace(/[ى]/g,'ي').replace(/[ة]/g,'ه').trim().split(/\s+/).filter(Boolean)}
function bestMatch(g,text){
  const raw=String(text||'').trim();
  const qn=normalizeText(raw);
  if(!qn)return 0;
  const name=normalizeText(g.name);
  if(name===qn)return 1;
  if(name.startsWith(qn))return .99;
  if(name.includes(qn))return .97;
  const qt=tokens(raw), nt=tokens(g.name);
  if(!qt.length||!nt.length)return 0;
  let total=0;
  for(const qtok of qt){
    let best=0;
    for(const ntok of nt){
      if(ntok===qtok) best=1;
      else if(ntok.startsWith(qtok)||qtok.startsWith(ntok)) best=Math.max(best,.92);
      else best=Math.max(best,similarity(ntok,qtok));
    }
    total+=best;
  }
  const tokenScore=total/qt.length;
  const whole=similarity(name,qn);
  return .75*tokenScore+.25*whole;
}

function search(){
  const raw=q.value.trim();
  if(!raw){current=[...games];page=1;render(tr('all'));return;}
  const qn=normalizeText(raw);
  const ranked=games.map(g=>{
    const nameKey=normalizeText(g.name);
    let score=bestMatch(g,raw);
    const al=aliases[nameKey]||[];
    for(const a of al){score=Math.max(score,similarity(a,raw));if(normalizeText(a)===qn)score=1;}
    return {g,score};
  });
  // Prefer real game records. Archive placeholders are shown only when nothing real matches.
  const realRanked=ranked.filter(x=>x.g.developer!=='Community Archive' && x.score>=0.62)
    .sort((a,b)=>b.score-a.score);
  const results=realRanked.length?realRanked:ranked.filter(x=>x.score>=0.78).sort((a,b)=>b.score-a.score);
  current=results.map(x=>x.g);
  page=1;
  render('نتائج البحث عن: '+raw);
}

function ageText(b){if(!b)return 'غير منشور بشكل موثوق';const d=new Date(b+'T00:00:00');const now=new Date();let a=now.getFullYear()-d.getFullYear();if(now.getMonth()<d.getMonth()||(now.getMonth()===d.getMonth()&&now.getDate()<d.getDate()))a--;return a+' سنة';}

function applyLanguage(){q.placeholder=lang==='ar'?'اكتب اسم اللعبة هنا...':tr('search')+'...';document.getElementById('searchBtn').textContent=tr('search');document.getElementById('navTitle').textContent=tr('nav');document.getElementById('navHome').textContent=tr('home');document.getElementById('navAll').textContent=tr('all');document.getElementById('navRandom').textContent=tr('random');document.getElementById('catTitle').textContent=tr('cats');document.getElementById('catAction').textContent=tr('action');document.getElementById('catRpg').textContent=tr('rpg');document.getElementById('catAdv').textContent=tr('adv');document.getElementById('catSports').textContent=tr('sports');}
document.addEventListener('click',e=>{
  const card=e.target.closest('.card');
  if(card){e.preventDefault();openGame(Number(card.dataset.index));return;}
  const a=e.target.closest('aside a');
  if(a){e.preventDefault();
    if(a.dataset.action==='home')home();
    else if(a.dataset.action==='catalog'){current=[...games];page=1;render(tr('all'));}
    else if(a.dataset.action==='random')openGame(Math.floor(Math.random()*games.length));
    else if(a.dataset.genre){current=games.filter(g=>g.genre.includes(a.dataset.genre));page=1;render(tr('cats')+': '+a.textContent);}
    return;
  }
  if(e.target.id==='prev'){e.preventDefault();if(page>1){page--;render(tr('all'));}}
  if(e.target.id==='next'){e.preventDefault();if(page*30<current.length){page++;render(tr('all'));}}
});
document.getElementById('searchBtn').addEventListener('click',search);q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';applyLanguage();home()});home();
